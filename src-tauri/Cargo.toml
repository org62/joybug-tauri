[package]
name = "joybug-tauri"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "joybug_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# DO NOT REMOVE!! Enabled by `tauri build`; switches the webview from the dev
# server (devUrl) to the embedded frontend served over the custom protocol.
# Without it, release binaries try to load http://localhost:1420 and fail.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` is auto-enabled in debug builds but not release; enable it
# explicitly so the WebView2 CDP endpoint (used by the e2e tests) is available
# in the release binary too.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
joybug2 = { path = "../external/joybug2" }
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.12"
uuid = { version = "1", features = ["v4"] }
# Update check against the GitHub Releases API. Both are already in the lock
# file (via symsrv and tauri), so declaring them costs no extra build time.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
semver = "1"
# Source-view checksum verification against PDB file records
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"

