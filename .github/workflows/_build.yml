# Reusable build + E2E job. Called by ci.yml (every push/PR) and release.yml
# (tag builds), so CI and releases always run the exact same steps.
name: Build & E2E

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Release version, with or without a leading "v". When set, artifacts are
          named Joybug-UI-<version>-<arch>.exe and get a SHA256 sidecar. When
          empty, dev naming (joybug-tauri-<arch>.exe) is used instead.
        type: string
        required: false
        default: ''
      retention-days:
        type: number
        required: false
        default: 14

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      # Both arches always report; one failing arch shouldn't mask the other.
      fail-fast: false
      matrix:
        arch: [ARM64, X64]
    runs-on:
      - self-hosted
      - Windows
      - ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    # The git tag is the only source of truth for the version. tauri.conf.json
    # carries a 0.0.0 placeholder in the repo and is stamped here, before the
    # build reads it - so the exe metadata and the About page both show the real
    # version without anything needing to be committed at release time.
    - name: Stamp version from tag
      if: inputs.version != ''
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $v = "${{ inputs.version }}" -replace '^v', ''
        $path = "src-tauri/tauri.conf.json"
        # Targeted replace rather than a JSON round-trip, which would reformat
        # the whole file. Anchoring on a two-space indent pins this to the
        # top-level key, so a nested "version" elsewhere can't be hit instead.
        $json = (Get-Content $path -Raw)
        $json = ([regex]'(?m)^  "version"\s*:\s*"[^"]*"').Replace($json, ('  "version": "{0}"' -f $v), 1)
        [IO.File]::WriteAllText("$PWD/$path", $json)
        # Assert on the parsed top-level field: a substring search over the file
        # would still pass if the replace had landed on the wrong key.
        if ((Get-Content $path -Raw | ConvertFrom-Json).version -ne $v) { throw "version stamp failed" }
        Write-Host "stamped version $v"

    - name: Install frontend dependencies
      run: npm ci

    - name: Build Tauri app
      run: npm run tauri build

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        JOYBUG_E2E_RELEASE: "1"

    - name: Stage artifacts
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        if ("${{ matrix.arch }}" -eq "X64") { $arch = "x64" } else { $arch = "aarch64" }
        $version = "${{ inputs.version }}" -replace '^v', ''

        $src = "src-tauri/target/release/joybug-tauri.exe"
        if (-not (Test-Path $src)) { throw "build output not found: $src" }

        Remove-Item -Recurse -Force artifacts -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force artifacts | Out-Null

        if ($version) { $name = "Joybug-UI-$version-$arch.exe" }
        else          { $name = "joybug-tauri-$arch.exe" }
        Copy-Item $src "artifacts/$name"

        if ($version) {
          # sha256sum-compatible sidecar: lowercase hash, two spaces, LF ending.
          $hash = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/artifacts/$name.sha256", "$hash  $name`n")
        }
        Get-ChildItem artifacts | Format-Table Name, Length

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: joybug-ui-${{ matrix.arch }}
        path: artifacts/*
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.arch }}
        path: playwright-report/
        retention-days: 14
