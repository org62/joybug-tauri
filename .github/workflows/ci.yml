name: CI

on:
  # Only main is listed under `push`. Feature branches are covered by
  # pull_request (which builds the merge preview), so a PR gets exactly one run
  # instead of two.
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
