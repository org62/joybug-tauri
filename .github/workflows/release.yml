# Releases are cut by tagging a commit on `main`:
#
#   node scripts/set-version.mjs 0.2.0   # on develop, commit, PR -> main
#   git tag -a v0.2.0 -m "v0.2.0" && git push origin v0.2.0
#
# The tag triggers this workflow: it re-validates the release preconditions,
# runs the full build + E2E suite on both arches, and only then publishes.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  verify:
    runs-on:
      - self-hosted
      - Windows
      - X64
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Verify tag is on main
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        git fetch origin main
        $sha = (git rev-parse HEAD).Trim()
        git merge-base --is-ancestor $sha FETCH_HEAD
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::Tag ${{ github.ref_name }} does not point at a commit on main. Merge to main before tagging."
          exit 1
        }

    - name: Verify version files match the tag
      run: node scripts/set-version.mjs --check ${{ github.ref_name }}

    - name: Verify joybug-core pin is on core main
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        Push-Location external/joybug2
        $pinned = (git rev-parse HEAD).Trim()
        git fetch origin main
        git merge-base --is-ancestor $pinned FETCH_HEAD
        if ($LASTEXITCODE -ne 0) {
          Write-Host "::error::joybug-core is pinned to $pinned, which is not on core's main branch."
          exit 1
        }
        Pop-Location

  build:
    needs: verify
    uses: ./.github/workflows/_build.yml
    with:
      version: ${{ github.ref_name }}
      retention-days: 90

  publish:
    needs: build
    runs-on:
      - self-hosted
      - Windows
      - X64
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: joybug-ui-*
        path: artifacts
        merge-multiple: true

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        # Anything like v0.2.0-rc.1 ships as a prerelease.
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        fail_on_unmatched_files: true
