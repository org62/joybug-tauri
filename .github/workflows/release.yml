# Releases are cut by tagging a commit on `main`:
#
#   node scripts/set-version.mjs 0.2.0   # commit, PR -> main, merge
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag runs the same build + E2E as CI, then publishes the binaries.
name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      # Enables release naming, SHA256 sidecars, and the version-vs-tag check.
      version: ${{ github.ref_name }}
      retention-days: 90

  publish:
    needs: build
    runs-on:
      - self-hosted
      - Windows
      - X64
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: joybug-ui-*
        path: artifacts
        merge-multiple: true

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        # Anything like v0.2.0-rc.1 ships as a prerelease.
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        fail_on_unmatched_files: true
