name: Build & E2E

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    strategy:
      matrix:
        arch: [ARM64, X64]
    runs-on:
      - self-hosted
      - Windows
      - ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install frontend dependencies
      run: npm ci

    - name: Build Tauri app
      run: npm run tauri build

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        JOYBUG_E2E_RELEASE: "1"

    - name: Rename executable for architecture
      run: |
        if ("${{ matrix.arch }}" -eq "X64") {
          Rename-Item -Path "src-tauri/target/release/joybug-tauri.exe" -NewName "joybug-tauri-x64.exe"
        } elseif ("${{ matrix.arch }}" -eq "ARM64") {
          Rename-Item -Path "src-tauri/target/release/joybug-tauri.exe" -NewName "joybug-tauri-aarch64.exe"
        }
      shell: powershell

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tauri-app-${{ matrix.arch }}
        path: src-tauri/target/release/joybug-tauri-*.exe

    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.arch }}
        path: playwright-report/
        retention-days: 14
